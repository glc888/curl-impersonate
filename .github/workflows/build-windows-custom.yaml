name: Build for windows
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - feature/*
      - bugfix/*
      - chore/*
      - security/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  LICENSE_FILES: >-
    LICENSE
    LICENSE_BORINGSSL
    LICENSE_CURL
    LICENSE_NGHTTP2
    LICENSE_NGHTTP3
    LICENSE_NGTCP2
    LICENSE_ZLIB
    LICENSE_ZSTD

jobs:
  build-windows:
    name: Build windows binaries
    strategy:
      matrix:
        include:
          - { sys: vcvars64, env: x86_64, runner: windows-2022 }
          - { sys: vcvars32, env: i686, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.3
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"

      - name: Install python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Check out the repo
        uses: actions/checkout@v2

      - name: Install NASM
        shell: cmd
        run: choco install nasm -y

      - name: Build
        shell: cmd
        run: ./win/build.bat ${{ matrix.sys }}

      - name: Prepare packages
        shell: bash
        run: |
          mkdir -p packages/bin packages/lib packages/include
          
          echo "=== Finding files ==="
          find deps -name "curl.h" 2>/dev/null || true
          find deps -name "curl-impersonate.exe" 2>/dev/null || true
          find deps -name "libcurl-impersonate*" 2>/dev/null || true
          
          echo "=== Copying include ==="
          curl_h_path=$(find deps -name "curl.h" 2>/dev/null | head -1)
          if [ -n "$curl_h_path" ]; then
            curl_dir=$(dirname "$curl_h_path")
            cp -r "$curl_dir" packages/include/ 2>/dev/null || true
          fi
          
          echo "=== Copying exe ==="
          exe_path=$(find deps -name "curl-impersonate.exe" 2>/dev/null | head -1)
          if [ -n "$exe_path" ]; then
            cp "$exe_path" packages/bin/
          fi
          
          echo "=== Copying libs ==="
          find deps -name "*.lib" -exec cp {} packages/lib/ \; 2>/dev/null || true
          find deps -name "*.dll" -exec cp {} packages/bin/ \; 2>/dev/null || true
          
          cp LICENSE* packages/ 2>/dev/null || true

      - name: List packages
        shell: bash
        run: |
          echo "=== packages ==="
          ls -la packages/ || true
          echo "=== packages/bin ==="
          ls -la packages/bin/ || true
          echo "=== packages/lib ==="
          ls -la packages/lib/ || true
          echo "=== packages/include ==="
          ls -la packages/include/ || true

      - name: Build tarballs
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ matrix.env }}-win32"
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            ver="${{ github.head_ref || github.ref_name }}"
            curl_tar="curl-impersonate-${ver}.${suffix}.tar.gz"
            lib_tar="libcurl-impersonate-${ver}.${suffix}.tar.gz"
          else
            curl_tar="curl-impersonate-${suffix}.tar.gz"
            lib_tar="libcurl-impersonate-${suffix}.tar.gz"
          fi
          tar -czf "$curl_tar" -C packages/bin . -C "$GITHUB_WORKSPACE/packages" $LICENSE_FILES
          if [ -d "packages/lib" ] && [ "$(ls -A packages/lib)" ]; then
            tar -czf "$lib_tar" -C packages/lib . -C packages/include . -C "$GITHUB_WORKSPACE/packages" $LICENSE_FILES
          else
            echo "No lib files found, skipping lib tarball"
            touch "$lib_tar"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts.windows.${{ matrix.env }}
          path: |
            ./curl-impersonate*.tar.gz
            ./libcurl-impersonate*.tar.gz
