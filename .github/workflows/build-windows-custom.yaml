name: Build Windows Custom

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    
    steps:
      - name: configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.3
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"

      - name: Install python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install NASM
        shell: cmd
        run: choco install nasm -y

      - name: Build x64
        shell: cmd
        run: ./win/build.bat vcvars64

      - name: Copy all artifacts
        shell: cmd
        run: |
          echo "Creating artifacts directory..."
          mkdir artifacts
          
          echo "Copying curl-impersonate.exe..."
          copy packages\bin\curl-impersonate.exe artifacts\
          copy packages\bin\*.bat artifacts\
          
          echo "Copying header files..."
          xcopy /E /I packages\include\curl artifacts\include\curl\
          
          echo "Copying libcurl-impersonate.lib..."
          copy packages\lib\*.lib artifacts\
          
          echo "Copying all dependency libraries from deps..."
          if exist deps\build\curl\lib\*.lib copy deps\build\curl\lib\*.lib artifacts\
          if exist deps\install\lib\*.lib copy deps\install\lib\*.lib artifacts\
          if exist deps\install\lib\*.a copy deps\install\lib\*.a artifacts\
          
          echo "Copying LICENSE files..."
          copy packages\*.LICENSE* artifacts\
          
          echo "Listing all artifacts:"
          dir /s artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curl-impersonate-windows-full
          path: |
            artifacts/*
