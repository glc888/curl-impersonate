name: Build for windows
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - feature/*
      - bugfix/*
      - chore/*
      - security/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  LICENSE_FILES: >-
    LICENSE
    LICENSE_BORINGSSL
    LICENSE_CURL
    LICENSE_NGHTTP2
    LICENSE_NGHTTP3
    LICENSE_NGTCP2
    LICENSE_ZLIB
    LICENSE_ZSTD

jobs:
  build-windows:
    name: Build windows binaries
    strategy:
      matrix:
        include:
          - { sys: vcvars64, env: x86_64, runner: windows-2022 }
          - { sys: vcvars32, env: i686, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.3
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"

      - name: Install python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Check out the repo
        uses: actions/checkout@v2

      - name: Install NASM
        shell: cmd
        run: choco install nasm -y

      - name: Build
        shell: cmd
        run: ./win/build.bat ${{ matrix.sys }}

      - name: List files
        shell: bash
        run: |
          echo "=== Current directory ==="
          pwd
          ls -la
          echo "=== deps/install ==="
          ls -la deps/install/ || true
          echo "=== deps/install/bin ==="
          ls -la deps/install/bin/ || true
          echo "=== deps/install/lib ==="
          ls -la deps/install/lib/ || true
          echo "=== deps/install/include ==="
          ls -la deps/install/include/ || true
          echo "=== deps/build/curl ==="
          ls -la deps/build/curl/ || true
          echo "=== deps/build/curl/src ==="
          ls -la deps/build/curl/src/ || true
          echo "=== deps/build/curl/include ==="
          ls -la deps/build/curl/include/ || true

      - name: Build tarballs
        shell: bash
        run: |
          set -euo pipefail
          suffix="${{ matrix.env }}-win32"
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            ver="${{ github.head_ref || github.ref_name }}"
            curl_tar="curl-impersonate-${ver}.${suffix}.tar.gz"
            lib_tar="libcurl-impersonate-${ver}.${suffix}.tar.gz"
          else
            curl_tar="curl-impersonate-${suffix}.tar.gz"
            lib_tar="libcurl-impersonate-${suffix}.tar.gz"
          fi
          echo "Creating tarballs..."
          tar -czf "$curl_tar" -C packages/bin . -C "$GITHUB_WORKSPACE/packages" $LICENSE_FILES
          tar -czf "$lib_tar" -C packages/lib . -C packages/include . -C "$GITHUB_WORKSPACE/packages" $LICENSE_FILES

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts.windows.${{ matrix.env }}
          path: |
            ./curl-impersonate*.tar.gz
            ./libcurl-impersonate*.tar.gz
